<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>membuat unordered list</title>
</head>
<body>
    <h1>mata pelajaran konsentrasi keahlian rpl</h1>
    <ul type="square"> 
         <li>ddpk</li>
         <li>pemrograman web</li>
         <li>basis data</li>
         <li>pemrograman berbasis web</li>
         <li>pemrograman perangkat bergerak</li> 

    </ul type="tranggle"> 
         <li>ddpk</li>
         <li>pemrograman web</li>
         <li>basis data</li>
         <li>pemrograman berbasis web</li>
         <li>pemrograman perangkat bergerak</li>
          


</body>
</html>
