<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>latihan form1</title>
</head>
<body>
    <p>INI YANG PERTAMA</p>
    <h1>FORM PENDAFTARAN</h1>
    <form>
        Nama : <input type="text">
        <br><br>
        Umur : <input type="number">
        <br><br>
        Tanggal lahir : <input type="date">
        <br><br>
        Jenis kelamin : <input type="text">
        <br><br>
        Alamat : <input type=" textarea">
        <br><br>
        Email : <input type="email">
        <br><br>
        

    </form>

    <p>INI YANG KEDUA</p>
    <h2>DATA SISWA</h2>

    <label for="nama">Nama lengkap: </label>
    <input type="text" id="nama" name="nama">
    <br><br/>
    <label for="umur">Umur: </label>
    <input type="number" id="umur" name="umur">
    <br><br>
    <label for="tanggal lahir">Tanggal lahir: </label>
    <input type="date" id="tanggal lahir" name="tanggal lahir">
    <br><br>
    <label for="text"  id="jenis kelamin">Jenis kelamin: </label>
    <input type="radio"  name="laki-laki" value="laki-laki">laki-laki
    <input type="radio"  name="perempuan" value="perempuan">Perempuan
    <br><br>
    <label for="alamat">Alamat: </label>
    <input type="textarea" id="alamat" name="alamat">
    <br><br>
    <label for="email">Email: </label>
    <input type="email" id="email" name="email">

</body>
</html>
