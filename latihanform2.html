<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form biodata siswa</title>
</head>
<body>
    <!DOCTYPE html>
<html>
<head>
    <title>Form Biodata Siswa</title>
</head>
<body>

<h2>FORM BIODATA SISWA</h2>

<form>
    <label>NIM</label>
    <input type="text" name="nim">
    <br><br>

    <label>Nama Lengkap</label>
    <input type="text" name="nama">
    <br><br>

    <label>Kelas</label>
    <select name="kelas">
        <option>X</option>
        <option>XI</option>
        <option>XII</option>
    </select>
    <br><br>

    <label>Jurusan</label>
    <input type="radio" name="jurusan" value="Teknik Informatika">
    Teknik Informatika
    <input type="radio" name="jurusan" value="Sistem Informasi">
    Sistem Informasi
    <input type="radio" name="jurusan" value="Multimedia">
    Multimedia
    <br><br>

    <label>Tempat dan Tanggal Lahir</label>
    <input type="text" name="tempat">

    <select name="tanggal">
        <option>Tanggal</option>
        <option>1</option>
        <option>2</option>
        <option>3</option>
        <option>4</option>
        <option>5</option>
    </select>

    <select name="bulan">
        <option>Bulan</option>
        <option>Januari</option>
        <option>Februari</option>
        <option>Maret</option>
        <option>April</option>
        <option>Mei</option>
        <option>Juni</option>
        <option>Juli</option>
        <option>Agustus</option>
        <option>September</option>
        <option>Oktober</option>
        <option>November</option>
        <option>Desember</option>
    </select>

    <select name="tahun">
        <option>Tahun</option>
        <option>2008</option>
        <option>2009</option>
        <option>2010</option>
        <option>2011</option>
    </select>
    <br><br>

    <label>Jenis Kelamin</label>
    <input type="radio" name="jk" value="Laki-laki">
    Laki-laki
    <input type="radio" name="jk" value="Perempuan">
    Perempuan
    <br><br>

    <label>Alamat</label>
    <input type="text" name="alamat">
    <br><br>

    <label>Email</label>
    <input type="text" name="email">
    
    <select name="domain">
        <option>@gmail.com</option>
        <option>@yahoo.com</option>
    </select>
    <br><br>

    <input type="submit" value="Submit">
    <input type="reset" value="Cancel">

</form>
</body>
</html>
